<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>病种数据 - 大医病理科规培病例上传模板转换工具</title>
		<link rel="icon" href="img/doro.png">
		<link rel="stylesheet" href="css/style.css">
		<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.38/vue.global.prod.js"></script>
		<script src="js/common.js"></script>
		<script src="js/components.js"></script>
	</head>
	<body>
		<div id="app"></div>

		<script>
			// 病种数据页：选项取 YAML 的 diagnoses 键，输出病种数据模板，localStorage 前缀 excel_tool
			createToolApp({
				navKey: 'disease',
				title: '病种数据模板转换',
				subtitle: '将导出的病例 Excel 转换为「登记手册病种数据模板（6.4.220913）」格式，自动去重并生成可上传的 .xls 文件。',
				optionLabel: '主要诊断',
				optionHint: '可从列表选择，也可自定义输入修改；文件名将自动取自诊断前 5 个字。',
				yamlKey: 'diagnoses',
				storagePrefix: 'excel_tool',
				template: 'disease'
			});
		</script>
	</body>
</html>
