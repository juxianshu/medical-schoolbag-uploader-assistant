<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>技能数据 - 大医病理科规培病例上传模板转换工具</title>
		<link rel="icon" href="img/doro.png">
		<link rel="stylesheet" href="css/style.css">
		<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.38/vue.global.prod.js"></script>
		<script src="js/common.js"></script>
		<script src="js/components.js"></script>
	</head>
	<body>
		<div id="app"></div>

		<script>
			// 技能数据页：选项取 YAML 的 skills 键，输出技能数据模板，localStorage 前缀 skill_tool（与病种数据互不干扰）
			createToolApp({
				navKey: 'skill',
				title: '技能数据模板转换',
				subtitle: '将导出的病例 Excel 转换为「登记手册技能数据模板（6.4.220913）」格式，自动去重并生成可上传的 .xls 文件。',
				optionLabel: '技能操作',
				optionHint: '可从列表选择，也可自定义输入修改；文件名将自动取自技能操作前 5 个字。',
				defaultSecondCategory: '门诊操作',
				yamlKey: 'skills',
				storagePrefix: 'skill_tool',
				template: 'skill'
			});
		</script>
	</body>
</html>
