# ============================================================
# options.yaml - 下拉选项统一配置文件
# 供「大医病理科规培病例上传模板转换工具」各页面动态加载
#   - diagnoses: 「病种数据」页面的主要诊断选项
#   - skills:    「技能数据」页面的技能操作选项
# 用法：每行一项，直接新增/删除/修改列表项即可，无需改 HTML
# 注意：每项以 "- " 开头；包含冒号时请将整项用引号包裹
# ============================================================

diagnoses:
  - 外阴感染性病变及鳞状上皮病变，宫颈炎、宫颈息肉、宫颈鳞状上皮内病变、宫颈癌、子宫内膜增生性病变、内膜息肉、内膜癌、内膜间质肿瘤
  - 肺肉芽肿性疾病、肺常见良性肿瘤、各类型肺癌、胸腺瘤
  - Baret食管、食管癌；慢性胃炎、胃溃疡、常见胃息肉、胃癌前病变、胃癌
  - 肾常见肿瘤
  - 软组织常见良性及恶性肿瘤
  - 反应性增生、常见炎性疾病
  - 常见甲状腺炎性疾病、结节性甲状腺肿、滤泡腺瘤、乳头状癌、滤泡癌、甲状旁腺增生、肾上腺皮髓质增生及肿瘤、垂体腺瘤、胰岛素瘤
  - 皮肤病基本病理改变
  - 喉常见炎性疾病及肿瘤
  - 常见神经上皮肿瘤
  - 心肌病
  - 正常阴道及宫颈脱落细胞
  - 正常呼吸道上皮形态
  - 正常体液中细胞的形态
  - 正常甲状腺滤泡上皮细胞形态
  - 正常消化道细胞形态
  - 正常尿路上皮细胞的形态

# 「技能数据」页面的技能操作选项（以下为示例占位，请替换为实际技能操作项目）
skills:
  - 熟悉脱水机、包埋机及切片机基本使用方法和组织包埋、切片方法
  - 掌握常规H-E染色原理及染色方法
  - 熟悉薄层细胞制片技术
  - H-E、巴氏、瑞氏染色法
  - 熟悉自动免疫组织化学仪器染色方法
  - 熟悉手工免疫组化染色方法
  - 了解冰冻切片基本操作技巧
  - 了解组织化学染色原理及常用方法